<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 280px; margin: 12px; }
    button { display: block; width: 100%; margin: 8px 0; padding: 8px; }
    #status { margin: 8px 0; color: #333; min-height: 2.6em; }
    .bad { color: #b00; }
    small { color: #666; }
  </style>
</head>
<body>
  <strong>IG Link Sync</strong>
  <div id="status"></div>
  <button id="now">Check now</button>
  <button id="deep">Import all posts (scrolls the profile)</button>
  <small>Import all opens the profile in a visible tab and scrolls until no more posts load. Use it once for the first import.</small>
  <button id="opts">Settings</button>
  <script src="popup.js"></script>
</body>
</html>
